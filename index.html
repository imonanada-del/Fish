<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لعبة صيد الأسماك التعليمية</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Noto Naskh Arabic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      font-family: 'Noto Naskh Arabic', serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      background-color: #1F3864;
      color: #ffffff;
      overflow: hidden;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
    }

    .ocean-bg {
      background: linear-gradient(180deg, #1b4965 0%, #1F3864 45%, #0b132b 100%);
    }

    @keyframes modalPop {
      0% { transform: scale(0.85); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .modal-anim {
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .option-btn {
      transition: all 0.2s ease;
      background: rgba(214, 228, 240, 0.15);
      border: 2px solid rgba(201, 162, 39, 0.5);
    }
    .option-btn:hover, .option-btn:active {
      background: rgba(201, 162, 39, 0.35);
      border-color: #C9A227;
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="ocean-bg relative flex flex-col justify-between h-screen w-screen overflow-hidden">

  <!-- الترويسة الثابتة الشريط العلوي -->
  <header id="mainHeader" class="fixed top-0 left-0 right-0 z-40 bg-[#1F3864]/95 border-b-2 border-[#C9A227] px-4 py-2 flex justify-between items-center shadow-lg transition-all">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-[#C9A227]/20 flex items-center justify-center border border-[#C9A227] text-xl">
        🎣
      </div>
      <div>
        <h1 id="headerTitle" class="text-xl md:text-2xl font-bold text-[#C9A227]">صيد الأسماك</h1>
      </div>
    </div>

    <!-- بيانات الطالب والإحصائيات -->
    <div id="gameStats" class="hidden flex items-center gap-4">
      <div class="bg-[#1F3864] px-3 py-1 rounded-lg border border-[#C9A227]/50 text-sm">
        <span class="text-[#D6E4F0]">الطالب/ة: </span>
        <span id="studentDisplayName" class="font-bold text-[#C9A227]"></span>
      </div>
      <div class="bg-[#1F3864] px-3 py-1 rounded-lg border border-[#C9A227]/50 text-sm">
        <span class="text-[#D6E4F0]">المصطاد: </span>
        <span id="scoreDisplay" class="font-bold text-emerald-400">0 / 17</span>
      </div>
    </div>
  </header>

  <!-- المساحة الآمنة أسفل الترويسة -->
  <div class="h-14 w-full flex-shrink-0"></div>

  <!-- الشاشة الافتتاحية -->
  <div id="startScreen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#1F3864]/95 backdrop-blur-md">
    <div class="max-w-md w-full bg-[#1F3864] border-2 border-[#C9A227] rounded-2xl p-6 text-center shadow-2xl relative modal-anim">
      <div class="text-6xl mb-3 animate-bounce">🐟</div>
      <h2 class="text-3xl font-bold text-[#C9A227] mb-2">أهلاً وسهلاً بك!</h2>
      <p class="text-[#D6E4F0] mb-6 text-sm md:text-base leading-relaxed">
        مرحباً بكم في رحلة صيد الأسماك التفاعلية! وجه السنارة نحو الأسماك لاصطيادها والإجابة عن الأسئلة.
      </p>

      <form onsubmit="startGame(event)" class="space-y-4">
        <div class="text-right">
          <label for="studentNameInput" class="block text-sm font-semibold text-[#C9A227] mb-1 mr-1">اسم الطالب / الطالبة:</label>
          <input type="text" id="studentNameInput" required placeholder="أدخل اسمك هنا..."
            class="w-full px-4 py-3 rounded-xl bg-[#D6E4F0]/10 border-2 border-[#C9A227]/60 text-white placeholder-white/50 focus:outline-none focus:border-[#C9A227] text-lg text-center font-bold">
        </div>

        <button type="submit" 
          class="w-full py-3.5 bg-[#C9A227] hover:bg-yellow-500 text-[#1F3864] font-bold text-xl rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
          <span>ابدأ اللعبة</span>
          <span class="text-2xl">🎣</span>
        </button>
      </form>
    </div>
  </div>

  <!-- منطقة اللعب Canvas -->
  <main class="relative flex-grow w-full h-full overflow-hidden">
    <canvas id="gameCanvas" class="w-full h-full block cursor-crosshair"></canvas>
  </main>

  <!-- نافذة السؤال -->
  <div id="questionModal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
    <div class="max-w-xl w-full bg-[#1F3864] border-2 border-[#C9A227] rounded-2xl p-6 shadow-2xl relative modal-anim">
      <div class="flex justify-between items-center border-b border-[#C9A227]/30 pb-3 mb-4">
        <span id="questionCategory" class="text-xs bg-[#C9A227]/20 text-[#C9A227] px-3 py-1 rounded-full border border-[#C9A227]/40">سؤال صيد</span>
        <span id="questionNumber" class="text-xs text-[#D6E4F0] font-bold"></span>
      </div>

      <h3 id="questionText" class="text-lg md:text-xl font-bold text-white mb-6 leading-relaxed text-center min-h-[60px] flex items-center justify-center"></h3>

      <div id="optionsContainer" class="space-y-3 mb-4"></div>
      <div id="modalFeedback" class="hidden text-center py-2 px-4 rounded-xl font-bold text-sm transition-all duration-300"></div>
    </div>
  </div>

  <!-- شاشة النهاية -->
  <div id="endScreen" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-[#1F3864]/95 backdrop-blur-md">
    <div class="max-w-md w-full bg-[#1F3864] border-2 border-[#C9A227] rounded-2xl p-8 text-center shadow-2xl relative modal-anim">
      <div class="text-6xl mb-4 flex justify-center gap-2">📚✍️</div>
      <h2 class="text-3xl font-bold text-[#C9A227] mb-2">إنجاز رائع ومتميز!</h2>
      <p id="endStudentGreeting" class="text-lg text-[#D6E4F0] mb-4"></p>
      
      <div class="bg-[#D6E4F0]/10 border border-[#C9A227]/40 rounded-xl p-4 mb-6">
        <p class="text-sm text-[#D6E4F0]">تم اصطياد جميع الأسماك بنجاح</p>
        <p class="text-3xl font-bold text-[#C9A227] mt-1" id="finalScoreText">17 / 17</p>
      </div>

      <button onclick="restartGame()" 
        class="w-full py-3.5 bg-[#C9A227] hover:bg-yellow-500 text-[#1F3864] font-bold text-lg rounded-xl shadow-lg transition-all active:scale-95">
        إعادة اللعب 🔄
      </button>
    </div>
  </div>

  <script>
    // --- 17 سؤالاً محدثاً بالكامل ---
    const questionsData = [
      { id: 1, type: 'tf', text: 'كان الإنسانُ قبل أن يخلقه الله معدومًا ليس مذكورًا.', options: ['صح', 'خطأ'], correct: 0 },
      { id: 2, type: 'tf', text: 'خلق الله السمع والبصر للاختبار.', options: ['صح', 'خطأ'], correct: 0 },
      { id: 3, type: 'tf', text: 'أرسل الله الرسل وأنزل الكتب هدايةً للناس.', options: ['صح', 'خطأ'], correct: 0 },
      { id: 4, type: 'tf', text: 'انقسم الناس إلى قسمين: إما شاكرًا وإما كفورًا.', options: ['صح', 'خطأ'], correct: 0 },
      { id: 5, type: 'tf', text: 'من كذب الرسل وكفر بالله دخل الجنة.', options: ['صح', 'خطأ'], correct: 1 },
      { id: 6, type: 'tf', text: 'أعد الله للكافرين سلاسلَ وأغلالًا وسعيرًا.', options: ['صح', 'خطأ'], correct: 0 },
      { id: 7, type: 'tf', text: 'مدح الله الذين يوفون بالنذر.', options: ['صح', 'خطأ'], correct: 0 },
      { id: 8, type: 'tf', text: 'يطعمون الطعام للفقراء وهم كارهون.', options: ['صح', 'خطأ'], correct: 1 },
      
      { id: 9, type: 'mc', text: 'قال تعالى: (هَلْ أَتَى عَلَى الإِنْسَانِ حِينٌ مِنَ الدَّهْرِ لَمْ يَكُنْ شَيْئًا مَذْكُورًا). الآية توضح أول حال الإنسان وأنها تحثه على...', options: ['التواضع', 'الكبر'], correct: 0 },
      { id: 10, type: 'mc', text: 'ما معنى (نبتليه) في قوله تعالى: (إِنَّا خَلَقْنَا الإِنْسَانَ مِنْ نُطْفَةٍ أَمْشَاجٍ نَبْتَلِيهِ...)?', options: ['نصيبه بالمرض', 'نختبره'], correct: 1 },
      { id: 11, type: 'mc', text: 'هدانا الله وعرّفنا الطريق الموصل إليه، فماذا حدث؟', options: ['استجاب جميع الخلق واتبعوا الرسل', 'انقسم الناس إلى فريقين: شاكرًا وكفورًا'], correct: 1 },
      { id: 12, type: 'mc', text: 'من هو الشاكر؟', options: ['الذي يشكر الله بلسانه فقط', 'المؤمن الذي يعمل بما أمره الله وينتهي عما نهاه'], correct: 1 },
      { id: 13, type: 'mc', text: 'ما جزاء الكفور الذي كفر بنعم الله؟', options: ['سلاسل وأغلال', 'السعير', 'كلاهما'], correct: 2 },
      { id: 14, type: 'mc', text: 'من هم "الأبرار" المذكورون في السورة؟', options: ['هم المؤمنون الصالحون الذين يفعلون الخير ويطيعون الله', 'الكفار'], correct: 0 },
      { id: 15, type: 'mc', text: 'ما جزاء الأبرار؟', options: ['يشربون من عين دائمة الفيضان شرابًا لذيذًا', 'من عين يفجرونها في أي مكان', 'كلاهما'], correct: 2 },
      { id: 16, type: 'mc', text: 'من صفات هؤلاء الأبرار:', options: ['الوفاء بالنذر', 'الخوف من الله', 'إطعام الطعام', 'جميع ما سبق'], correct: 3 },
      { id: 17, type: 'mc', text: 'لماذا يُطعم الأبرار المحتاجين؟', options: ['لوجه الله تعالى لا يريدون منهم جزاءً ولا شكراً', 'ليمدحهم الناس'], correct: 0 }
    ];

    // --- نظام محاكاة الصوت بدون روابط ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSuccessSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(f, now + i * 0.08);
        gain.gain.setValueAtTime(0.2, now + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + i * 0.08);
        osc.stop(now + i * 0.08 + 0.3);
      });
    }

    function playErrorSound() {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(180, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    // --- عناصر وبيانات المحاكاة ---
    let studentName = "";
    let score = 0;
    let canvas, ctx;
    let fishes = [];
    let bubbles = [];
    let activeFish = null;
    let isQuestionOpen = false;
    let gameStarted = false;

    // موقع السنارة
    let hook = {
      x: 0,
      y: 150,
      targetX: 0,
      targetY: 150,
      radius: 18 // نطاق التصادم الجريء والدقيق
    };

    const fishColors = [
      { body: '#FF6B6B', fin: '#EE5253' },
      { body: '#48DBFB', fin: '#0ABDE3' },
      { body: '#1DD1A1', fin: '#10AC84' },
      { body: '#FECA57', fin: '#FF9F43' },
      { body: '#FF9FF3', fin: '#F368E0' }
    ];

    window.addEventListener('load', () => {
      canvas = document.getElementById('gameCanvas');
      ctx = canvas.getContext('2d');
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // تتبع الماوس واللمس للسنارة
      const updatePosition = (clientX, clientY) => {
        if (!gameStarted || isQuestionOpen) return;
        const rect = canvas.getBoundingClientRect();
        hook.targetX = clientX - rect.left;
        hook.targetY = Math.max(120, clientY - rect.top);
      };

      window.addEventListener('mousemove', (e) => updatePosition(e.clientX, e.clientY));
      window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) updatePosition(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      window.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) updatePosition(e.touches[0].clientX, e.touches[0].clientY);
      }, { passive: true });

      // تحضير الفقاعات الخلفية
      for (let i = 0; i < 30; i++) {
        bubbles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 4 + 2,
          speed: Math.random() * 0.8 + 0.4
        });
      }
    });

    function resizeCanvas() {
      if (!canvas) return;
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (!hook.x) {
        hook.x = canvas.width / 2;
        hook.targetX = canvas.width / 2;
      }
    }

    function startGame(e) {
      e.preventDefault();
      const nameInput = document.getElementById('studentNameInput');
      if (!nameInput.value.trim()) return;

      studentName = nameInput.value.trim();
      initAudio();

      document.getElementById('studentDisplayName').innerText = studentName;
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('gameStats').classList.remove('hidden');

      gameStarted = true;
      createFishes();
      requestAnimationFrame(gameLoop);
    }

    function createFishes() {
      fishes = [];
      const total = questionsData.length;
      
      for (let i = 0; i < total; i++) {
        const colorObj = fishColors[i % fishColors.length];
        const dir = Math.random() > 0.5 ? 1 : -1;
        
        fishes.push({
          id: i,
          question: questionsData[i],
          x: 80 + Math.random() * (canvas.width - 160),
          y: 140 + Math.random() * (canvas.height - 220),
          vx: (Math.random() * 1.2 + 0.8) * dir,
          vy: (Math.random() * 0.4 - 0.2),
          size: 32,
          color: colorObj.body,
          finColor: colorObj.fin,
          caught: false,
          tailAngle: Math.random() * Math.PI,
          tailSpeed: 0.1
        });
      }
    }

    // --- المحاكاة والتحريك ---
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. رسم الفقاعات
      drawBubbles();

      // 2. تحديث ورسم السنارة والخطاف
      updateAndDrawHook();

      // 3. تحديث ورسم الأسماك واكتشاف التصادم
      updateAndDrawFishes();

      requestAnimationFrame(gameLoop);
    }

    function drawBubbles() {
      ctx.fillStyle = 'rgba(214, 228, 240, 0.25)';
      bubbles.forEach(b => {
        b.y -= b.speed;
        if (b.y < 60) {
          b.y = canvas.height + 10;
          b.x = Math.random() * canvas.width;
        }
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
        ctx.fill();
      });
    }

    function updateAndDrawHook() {
      // حركة سلسة نحو المستهدف
      hook.x += (hook.targetX - hook.x) * 0.15;
      hook.y += (hook.targetY - hook.y) * 0.15;

      // حبل السنارة
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0); // ينزل من منتصف أعلى الترويسة
      ctx.lineTo(hook.x, hook.y);
      ctx.strokeStyle = '#D6E4F0';
      ctx.lineWidth = 2;
      ctx.stroke();

      // الخطاف الذهبي (رأس السنارة)
      ctx.save();
      ctx.translate(hook.x, hook.y);
      
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI, false);
      ctx.lineTo(10, -12);
      ctx.lineWidth = 4.5;
      ctx.strokeStyle = '#C9A227';
      ctx.stroke();

      // رأس الخطاف المدبب
      ctx.beginPath();
      ctx.arc(-10, -2, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#C9A227';
      ctx.fill();

      ctx.restore();
    }

    function updateAndDrawFishes() {
      fishes.forEach(fish => {
        if (fish.caught) return;

        // التحريك البسيط طالما النافذة ليست مفتوحة
        if (!isQuestionOpen) {
          fish.x += fish.vx;
          fish.y += fish.vy;
          fish.tailAngle += fish.tailSpeed;

          // ارتداد حواف بمسافة آمنة لتبقى مرئية 100%
          const margin = 50;
          if (fish.x < margin) { fish.x = margin; fish.vx *= -1; }
          if (fish.x > canvas.width - margin) { fish.x = canvas.width - margin; fish.vx *= -1; }
          if (fish.y < 120) { fish.y = 120; fish.vy *= -1; }
          if (fish.y > canvas.height - 70) { fish.y = canvas.height - 70; fish.vy *= -1; }

          // فحص التصادم المباشر بين رأس السنارة (الخطاف) والسمكة
          const dx = hook.x - fish.x;
          const dy = hook.y - fish.y;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < hook.radius + fish.size * 0.7) {
            openQuestionModal(fish);
          }
        }

        // رسم السمكة
        ctx.save();
        ctx.translate(fish.x, fish.y);
        const facingRight = fish.vx > 0;
        if (!facingRight) ctx.scale(-1, 1);

        // ذيل السمكة
        const tailWag = Math.sin(fish.tailAngle) * 7;
        ctx.beginPath();
        ctx.moveTo(-fish.size + 4, 0);
        ctx.lineTo(-fish.size - 14, -10 + tailWag);
        ctx.lineTo(-fish.size - 14, 10 + tailWag);
        ctx.closePath();
        ctx.fillStyle = fish.finColor;
        ctx.fill();

        // جسم السمكة
        ctx.beginPath();
        ctx.ellipse(0, 0, fish.size, fish.size * 0.6, 0, 0, Math.PI * 2);
        ctx.fillStyle = fish.color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#FFFFFF';
        ctx.stroke();

        // عين السمكة
        ctx.beginPath();
        ctx.arc(fish.size * 0.5, -fish.size * 0.15, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#FFFFFF';
        ctx.fill();
        ctx.beginPath();
        ctx.arc(fish.size * 0.53, -fish.size * 0.15, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#000000';
        ctx.fill();

        // رقم السؤال على جسم السمكة
        ctx.save();
        if (!facingRight) ctx.scale(-1, 1);
        ctx.fillStyle = '#1F3864';
        ctx.font = 'bold 13px "Noto Naskh Arabic", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(fish.question.id, 0, 1);
        ctx.restore();

        ctx.restore();
      });
    }

    // --- فتح نافذة السؤال ---
    function openQuestionModal(fish) {
      isQuestionOpen = true;
      activeFish = fish;

      const modal = document.getElementById('questionModal');
      const q = fish.question;

      document.getElementById('questionNumber').innerText = `السؤال ${q.id} من 17`;
      document.getElementById('questionCategory').innerText = q.type === 'tf' ? 'صح أم خطأ' : 'اختيار من متعدد';
      document.getElementById('questionText').innerText = q.text;

      const optionsContainer = document.getElementById('optionsContainer');
      optionsContainer.innerHTML = '';

      const feedback = document.getElementById('modalFeedback');
      feedback.className = 'hidden text-center py-2 px-4 rounded-xl font-bold text-sm transition-all duration-300';

      q.options.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn w-full py-3 px-4 rounded-xl text-right font-semibold text-white text-base flex items-center justify-between cursor-pointer';
        btn.innerHTML = `
          <span>${optText}</span>
          <span class="w-6 h-6 rounded-full border border-[#C9A227]/60 flex items-center justify-center text-xs text-[#C9A227] font-bold">${index + 1}</span>
        `;
        btn.onclick = () => handleAnswer(index, btn);
        optionsContainer.appendChild(btn);
      });

      modal.classList.remove('hidden');
    }

    function handleAnswer(selectedIndex, btnElement) {
      const q = activeFish.question;
      const feedback = document.getElementById('modalFeedback');
      const allBtns = document.querySelectorAll('.option-btn');

      allBtns.forEach(b => b.style.pointerEvents = 'none');

      if (selectedIndex === q.correct) {
        playSuccessSound();
        btnElement.classList.add('bg-emerald-600/70', 'border-emerald-400');
        
        feedback.innerText = 'أحسنت! إجابة صحيحة ورائعة';
        feedback.className = 'block bg-emerald-500/20 text-emerald-300 border border-emerald-500/50 text-center py-2.5 px-4 rounded-xl font-bold text-base modal-anim';

        setTimeout(() => {
          activeFish.caught = true; // اختفاء السمكة عند الإجابة الصحيحة
          score++;
          document.getElementById('scoreDisplay').innerText = `${score} / 17`;

          closeModal();

          if (score >= questionsData.length) {
            showEndScreen();
          }
        }, 1100);

      } else {
        playErrorSound();
        btnElement.classList.add('bg-rose-600/70', 'border-rose-500');

        feedback.innerText = 'إجابة خاطئة، حاول مرة أخرى!';
        feedback.className = 'block bg-rose-500/20 text-rose-300 border border-rose-500/50 text-center py-2.5 px-4 rounded-xl font-bold text-base modal-anim';

        setTimeout(() => {
          closeModal();
          // تبقى السمكة في المكان ليتم محاولتها مجدداً
        }, 1200);
      }
    }

    function closeModal() {
      document.getElementById('questionModal').classList.add('hidden');
      isQuestionOpen = false;
      activeFish = null;
      // سحب السنارة للأعلى قليلاً لتفادي التصادم الفوري بنفس السمكة
      hook.targetY = 130;
      hook.y = 130;
    }

    function showEndScreen() {
      document.getElementById('endStudentGreeting').innerText = `البطل / البطلة: ${studentName}`;
      document.getElementById('finalScoreText').innerText = `${score} / 17`;
      document.getElementById('endScreen').classList.remove('hidden');
    }

    function restartGame() {
      score = 0;
      document.getElementById('scoreDisplay').innerText = `0 / 17`;
      document.getElementById('endScreen').classList.add('hidden');
      createFishes();
    }
  </script>
</body>
</html>
